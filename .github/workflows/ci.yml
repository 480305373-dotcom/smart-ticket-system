name: Verify application
on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish the existing draft after full verification
        type: boolean
        default: false
      release_tag:
        description: Existing draft release tag
        type: string
        default: v1.1.0
  push:
    branches: [main, 'codex/**']
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_DB: intelligent_ticket
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d intelligent_ticket"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
      rabbitmq:
        image: rabbitmq:4-management
        ports: ['5672:5672']
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v7
      - name: Verify delivery tool reporting
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B clean package -Dinfra.tests=true
        env:
          DB_PASSWORD: ci-only-password
          ENTERPRISE_DB_URL: jdbc:postgresql://localhost:5432/intelligent_ticket
          ENTERPRISE_DB_USER: postgres
          ENTERPRISE_DB_PASSWORD: ci-only-password
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci && npm test && npm run build
        working-directory: frontend
      - name: Record executable and frontend build evidence
        run: python3 scripts/record_product_build.py
      - name: Deploy complete Docker stack
        shell: pwsh
        run: ./scripts/deploy-local.ps1 -Demo -Monitoring -Prebuilt -Build
      - name: Verify Nginx, infrastructure and monitoring
        run: python3 scripts/deployment_smoke.py --monitoring
      - name: Deployment diagnostics on failure
        if: failure() && hashFiles('.runtime/production.env') != ''
        run: docker compose -p smartticket-production --env-file .runtime/production.env -f compose.yaml -f compose.prod.yaml --profile monitoring logs --tail=80
      - name: Save deployment verification
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-verification
          path: docs/deployment-verification.json
      - name: Package verified release
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release
        run: python3 scripts/package_release.py --product
      - name: Save release binaries
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release
        uses: actions/upload-artifact@v4
        with:
          name: complete-release
          path: artifacts/smart-ticket-system-complete.zip*
          compression-level: 0
  release:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: complete-release
          path: artifacts
      - name: Upload and publish verified draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true
          (cd artifacts && sha256sum --check smart-ticket-system-complete.zip.sha256)
          gh release upload "$RELEASE_TAG" artifacts/smart-ticket-system-complete.zip artifacts/smart-ticket-system-complete.zip.sha256 --clobber
          gh release edit "$RELEASE_TAG" --target "$RELEASE_COMMIT" --draft=false --latest
