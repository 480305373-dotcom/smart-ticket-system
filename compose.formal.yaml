# Use only with the dedicated smartticket-formal project and .runtime/formal.env.
services:
  postgres:
    mem_limit: 512m
  registry:
    ports: !reset []
  backend:
    environment:
      SPRING_PROFILES_ACTIVE: ${FORMAL_PROFILES:-prod,distributed}
      ADMIN_USERNAME: ${ADMIN_USERNAME:?required}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?required}
      APP_MONITOR_ENABLED: "true"
      MONITOR_PASSWORD: ${MONITOR_PASSWORD:?required}
      APP_RATE_LIMIT_PER_MINUTE: "120"
      REGISTRATION_ENABLED: "false"
      CORS_ORIGINS: https://localhost:8443,https://127.0.0.1:8443
      JWT_EXPIRATION: "3600000"
  knowledge:
    environment:
      SPRINGDOC_API_DOCS_ENABLED: "false"
      SPRINGDOC_SWAGGER_UI_ENABLED: "false"
      SERVER_ERROR_INCLUDE_MESSAGE: never
      SERVER_ERROR_INCLUDE_STACKTRACE: never
  frontend:
    ports: !override ["127.0.0.1:8089:80", "127.0.0.1:8443:443"]
    volumes:
      - ./docker/formal/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./.runtime/formal/tls:/etc/nginx/tls:ro
