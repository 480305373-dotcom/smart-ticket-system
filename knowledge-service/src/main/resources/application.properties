spring.application.name=smartticket-knowledge
server.port=8080
spring.datasource.url=${KNOWLEDGE_DB_URL}
spring.datasource.username=knowledge
spring.datasource.password=${KNOWLEDGE_DB_PASSWORD}
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:knowledge-schema.sql
mybatis-plus.configuration.map-underscore-to-camel-case=true
eureka.client.service-url.defaultZone=${EUREKA_URL:http://registry:8080/eureka/}
eureka.client.registry-fetch-interval-seconds=5
eureka.client.initial-instance-info-replication-interval-seconds=5
eureka.client.restclient.timeout.connect-timeout=3000
eureka.client.restclient.timeout.socket-timeout=5000
eureka.client.healthcheck.enabled=true
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${HOSTNAME:${random.uuid}}
eureka.instance.lease-renewal-interval-in-seconds=5
eureka.instance.lease-expiration-duration-in-seconds=15
eureka.instance.health-check-url-path=/actuator/health/readiness
eureka.instance.status-page-url-path=/actuator/health
spring.cloud.loadbalancer.cache.ttl=2s
app.internal-key=${INTERNAL_SERVICE_KEY}
app.knowledge.remote=false
app.ai.enabled=false
spring.ai.model.chat=none
spring.ai.model.embedding=none
spring.autoconfigure.exclude=org.springframework.ai.vectorstore.pgvector.autoconfigure.PgVectorStoreAutoConfiguration
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db
management.health.redis.enabled=false
management.health.rabbit.enabled=false
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
