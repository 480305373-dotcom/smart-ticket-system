listeners.tcp.default = 5672
cluster_formation.peer_discovery_backend = classic_config
cluster_formation.classic_config.nodes.1 = rabbit@rabbit-0
cluster_formation.classic_config.nodes.2 = rabbit@rabbit-1
cluster_formation.classic_config.nodes.3 = rabbit@rabbit-2
cluster_partition_handling = pause_minority
queue_leader_locator = balanced
vm_memory_high_watermark.absolute = 256MiB
disk_free_limit.absolute = 128MB
quorum_queue.continuous_membership_reconciliation.enabled = true
quorum_queue.continuous_membership_reconciliation.target_group_size = 3
quorum_queue.continuous_membership_reconciliation.interval = 10000
quorum_queue.continuous_membership_reconciliation.auto_remove = false
