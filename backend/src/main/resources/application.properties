spring.datasource.url=jdbc:postgresql://localhost:5432/intelligent_ticket
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000
# =========================
# Spring AI - Ollama
# =========================

spring.ai.ollama.base-url=http://localhost:11434

spring.ai.model.chat=ollama
spring.ai.ollama.chat.model=qwen3:4b

spring.ai.model.embedding=ollama
spring.ai.ollama.embedding.model=nomic-embed-text

# =========================
# Spring AI - PGVector
# =========================

spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

spring.data.redis.host=localhost
spring.data.redis.port=6379

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# RabbitMQ 消费失败重试
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-retries=3
spring.rabbitmq.listener.simple.retry.initial-interval=1s
spring.rabbitmq.listener.simple.retry.multiplier=2
spring.rabbitmq.listener.simple.retry.max-interval=5s
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.config.import=optional:file:./config/application-local.properties,optional:file:./backend/config/application-local.properties
app.redis.enabled=true
app.mq.enabled=true
app.cors.origins=${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
spring.profiles.group.enterprise=dev,infra
app.ai.enabled=false
spring.ai.model.chat=none
spring.ai.model.embedding=none
spring.autoconfigure.exclude=org.springframework.ai.vectorstore.pgvector.autoconfigure.PgVectorStoreAutoConfiguration
spring.data.redis.connect-timeout=2s
spring.data.redis.timeout=2s
spring.rabbitmq.connection-timeout=3s
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true
spring.rabbitmq.listener.simple.prefetch=10
spring.rabbitmq.listener.simple.concurrency=2
spring.rabbitmq.listener.simple.max-concurrency=4
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when_authorized
management.endpoint.health.roles=ADMIN
management.endpoint.health.probes.enabled=true
management.health.redis.enabled=${app.redis.enabled}
management.health.rabbit.enabled=${app.mq.enabled}
management.metrics.tags.application=smart-ticket
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
logging.pattern.level=%5p [requestId:%X{requestId:-}]
app.rate-limit.per-minute=120
app.outbox.max-attempts=10
app.registration.enabled=true
spring.task.scheduling.pool.size=4
spring.task.scheduling.thread-name-prefix=smartticket-scheduler-
spring.config.import=optional:file:./config/application-local.properties,optional:file:./backend/config/application-local.properties,optional:file:./config/application-enterprise-local.properties,optional:file:./backend/config/application-enterprise-local.properties
