{
  "services": {
    "postgres": {
      "image": "pgvector/pgvector:pg18",
      "environment": {
        "POSTGRES_USER": "cluster_admin",
        "POSTGRES_PASSWORD": "${POSTGRES_PASSWORD:?required}",
        "CORE_DB_PASSWORD": "${CORE_DB_PASSWORD:?required}",
        "KNOWLEDGE_DB_PASSWORD": "${KNOWLEDGE_DB_PASSWORD:?required}"
      },
      "volumes": [
        "postgres:/var/lib/postgresql",
        "./docker/distributed/postgres-init.sh:/docker-entrypoint-initdb.d/init.sh:ro"
      ],
      "healthcheck": {
        "test": [
          "CMD-SHELL",
          "pg_isready -U cluster_admin -d postgres"
        ],
        "interval": "5s",
        "retries": 30
      },
      "restart": "unless-stopped"
    },
    "registry": {
      "image": "smartticket/registry:local",
      "build": {
        "context": ".",
        "dockerfile": "docker/distributed/Service.Dockerfile",
        "args": {
          "MODULE": "registry"
        }
      },
      "ports": [
        "127.0.0.1:8501:8080"
      ],
      "environment": {
        "JAVA_TOOL_OPTIONS": "-XX:ActiveProcessorCount=2"
      },
      "mem_limit": "384m",
      "healthcheck": {
        "test": [
          "CMD-SHELL",
          "wget -q --spider http://127.0.0.1:8080/actuator/health/readiness"
        ],
        "interval": "5s",
        "start_period": "30s",
        "retries": 30
      },
      "restart": "unless-stopped"
    },
    "redis-0": {
      "image": "redis:7-alpine",
      "hostname": "redis-0",
      "entrypoint": [
        "sh",
        "/opt/redis-start.sh"
      ],
      "environment": {
        "REDIS_PASSWORD": "${REDIS_PASSWORD:?required}",
        "NODE_NAME": "redis-0"
      },
      "volumes": [
        "redis-0:/data",
        "./docker/distributed/redis-start.sh:/opt/redis-start.sh:ro"
      ],
      "healthcheck": {
        "test": [
          "CMD-SHELL",
          "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping | grep PONG"
        ],
        "interval": "5s",
        "retries": 30
      },
      "restart": "unless-stopped"
    },
    "redis-1": {
      "image": "redis:7-alpine",
      "hostname": "redis-1",
      "entrypoint": [
        "sh",
        "/opt/redis-start.sh"
      ],
      "environment": {
        "REDIS_PASSWORD": "${REDIS_PASSWORD:?required}",
        "NODE_NAME": "redis-1"
      },
      "volumes": [
        "redis-1:/data",
        "./docker/distributed/redis-start.sh:/opt/redis-start.sh:ro"
      ],
      "healthcheck": {
        "test": [
          "CMD-SHELL",
          "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping | grep PONG"
        ],
        "interval": "5s",
        "retries": 30
      },
      "restart": "unless-stopped"
    },
    "redis-2": {
      "image": "redis:7-alpine",
      "hostname": "redis-2",
      "entrypoint": [
        "sh",
        "/opt/redis-start.sh"
      ],
      "environment": {
        "REDIS_PASSWORD": "${REDIS_PASSWORD:?required}",
        "NODE_NAME": "redis-2"
      },
      "volumes": [
        "redis-2:/data",
        "./docker/distributed/redis-start.sh:/opt/redis-start.sh:ro"
      ],
      "healthcheck": {
        "test": [
          "CMD-SHELL",
          "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping | grep PONG"
        ],
        "interval": "5s",
        "retries": 30
      },
      "restart": "unless-stopped"
    },
    "redis-3": {
      "image": "redis:7-alpine",
      "hostname": "redis-3",
      "entrypoint": [
        "sh",
        "/opt/redis-start.sh"
      ],
      "environment": {
        "REDIS_PASSWORD": "${REDIS_PASSWORD:?required}",
        "NODE_NAME": "redis-3"
      },
      "volumes": [
        "redis-3:/data",
        "./docker/distributed/redis-start.sh:/opt/redis-start.sh:ro"
      ],
      "healthcheck": {
        "test": [
          "CMD-SHELL",
          "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping | grep PONG"
        ],
        "interval": "5s",
        "retries": 30
      },
      "restart": "unless-stopped"
    },
    "redis-4": {
      "image": "redis:7-alpine",
      "hostname": "redis-4",
      "entrypoint": [
        "sh",
        "/opt/redis-start.sh"
      ],
      "environment": {
        "REDIS_PASSWORD": "${REDIS_PASSWORD:?required}",
        "NODE_NAME": "redis-4"
      },
      "volumes": [
        "redis-4:/data",
        "./docker/distributed/redis-start.sh:/opt/redis-start.sh:ro"
      ],
      "healthcheck": {
        "test": [
          "CMD-SHELL",
          "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping | grep PONG"
        ],
        "interval": "5s",
        "retries": 30
      },
      "restart": "unless-stopped"
    },
    "redis-5": {
      "image": "redis:7-alpine",
      "hostname": "redis-5",
      "entrypoint": [
        "sh",
        "/opt/redis-start.sh"
      ],
      "environment": {
        "REDIS_PASSWORD": "${REDIS_PASSWORD:?required}",
        "NODE_NAME": "redis-5"
      },
      "volumes": [
        "redis-5:/data",
        "./docker/distributed/redis-start.sh:/opt/redis-start.sh:ro"
      ],
      "healthcheck": {
        "test": [
          "CMD-SHELL",
          "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping | grep PONG"
        ],
        "interval": "5s",
        "retries": 30
      },
      "restart": "unless-stopped"
    },
    "redis-init": {
      "image": "redis:7-alpine",
      "restart": "no",
      "entrypoint": [
        "sh",
        "/opt/init.sh"
      ],
      "environment": {
        "REDIS_PASSWORD": "${REDIS_PASSWORD:?required}"
      },
      "volumes": [
        "./docker/distributed/redis-init.sh:/opt/init.sh:ro"
      ],
      "depends_on": {
        "redis-0": {
          "condition": "service_healthy"
        },
        "redis-1": {
          "condition": "service_healthy"
        },
        "redis-2": {
          "condition": "service_healthy"
        },
        "redis-3": {
          "condition": "service_healthy"
        },
        "redis-4": {
          "condition": "service_healthy"
        },
        "redis-5": {
          "condition": "service_healthy"
        }
      }
    },
    "rabbit-0": {
      "image": "rabbitmq:4-management",
      "hostname": "rabbit-0",
      "environment": {
        "RABBITMQ_NODENAME": "rabbit@rabbit-0",
        "RABBITMQ_ERLANG_COOKIE": "${RABBITMQ_COOKIE:?required}",
        "RABBITMQ_DEFAULT_USER": "smartticket",
        "RABBITMQ_DEFAULT_PASS": "${RABBITMQ_PASSWORD:?required}",
        "RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS": "+S 2:2"
      },
      "volumes": [
        "rabbit-0:/var/lib/rabbitmq",
        "./docker/distributed/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro"
      ],
      "healthcheck": {
        "test": [
          "CMD-SHELL",
          "rabbitmq-diagnostics -q ping && rabbitmqctl -q eval 'length(rabbit_nodes:list_running()).' | grep -q '^3$'"
        ],
        "interval": "10s",
        "timeout": "10s",
        "retries": 30
      },
      "restart": "unless-stopped"
    },
    "rabbit-1": {
      "image": "rabbitmq:4-management",
      "hostname": "rabbit-1",
      "environment": {
        "RABBITMQ_NODENAME": "rabbit@rabbit-1",
        "RABBITMQ_ERLANG_COOKIE": "${RABBITMQ_COOKIE:?required}",
        "RABBITMQ_DEFAULT_USER": "smartticket",
        "RABBITMQ_DEFAULT_PASS": "${RABBITMQ_PASSWORD:?required}",
        "RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS": "+S 2:2"
      },
      "volumes": [
        "rabbit-1:/var/lib/rabbitmq",
        "./docker/distributed/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro"
      ],
      "healthcheck": {
        "test": [
          "CMD-SHELL",
          "rabbitmq-diagnostics -q ping && rabbitmqctl -q eval 'length(rabbit_nodes:list_running()).' | grep -q '^3$'"
        ],
        "interval": "10s",
        "timeout": "10s",
        "retries": 30
      },
      "restart": "unless-stopped"
    },
    "rabbit-2": {
      "image": "rabbitmq:4-management",
      "hostname": "rabbit-2",
      "environment": {
        "RABBITMQ_NODENAME": "rabbit@rabbit-2",
        "RABBITMQ_ERLANG_COOKIE": "${RABBITMQ_COOKIE:?required}",
        "RABBITMQ_DEFAULT_USER": "smartticket",
        "RABBITMQ_DEFAULT_PASS": "${RABBITMQ_PASSWORD:?required}",
        "RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS": "+S 2:2"
      },
      "volumes": [
        "rabbit-2:/var/lib/rabbitmq",
        "./docker/distributed/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro"
      ],
      "healthcheck": {
        "test": [
          "CMD-SHELL",
          "rabbitmq-diagnostics -q ping && rabbitmqctl -q eval 'length(rabbit_nodes:list_running()).' | grep -q '^3$'"
        ],
        "interval": "10s",
        "timeout": "10s",
        "retries": 30
      },
      "restart": "unless-stopped"
    },
    "knowledge": {
      "image": "smartticket/knowledge-service:local",
      "build": {
        "context": ".",
        "dockerfile": "docker/distributed/Service.Dockerfile",
        "args": {
          "MODULE": "knowledge-service"
        }
      },
      "environment": {
        "EUREKA_URL": "http://registry:8080/eureka/",
        "INTERNAL_SERVICE_KEY": "${INTERNAL_SERVICE_KEY:?required}",
        "TZ": "Asia/Shanghai",
        "JAVA_TOOL_OPTIONS": "-Duser.timezone=Asia/Shanghai -XX:ActiveProcessorCount=2",
        "KNOWLEDGE_DB_URL": "jdbc:postgresql://postgres:5432/smartticket_knowledge",
        "KNOWLEDGE_DB_PASSWORD": "${KNOWLEDGE_DB_PASSWORD:?required}"
      },
      "depends_on": {
        "postgres": {
          "condition": "service_healthy"
        },
        "registry": {
          "condition": "service_healthy"
        }
      },
      "healthcheck": {
        "test": [
          "CMD-SHELL",
          "wget -q --spider http://127.0.0.1:8080/actuator/health/readiness"
        ],
        "interval": "10s",
        "start_period": "90s",
        "retries": 30
      },
      "mem_limit": "512m",
      "restart": "unless-stopped"
    },
    "backend": {
      "image": "smartticket/backend:local",
      "build": {
        "context": ".",
        "dockerfile": "docker/distributed/Service.Dockerfile",
        "args": {
          "MODULE": "backend"
        }
      },
      "environment": {
        "EUREKA_URL": "http://registry:8080/eureka/",
        "INTERNAL_SERVICE_KEY": "${INTERNAL_SERVICE_KEY:?required}",
        "TZ": "Asia/Shanghai",
        "JAVA_TOOL_OPTIONS": "-Duser.timezone=Asia/Shanghai -XX:ActiveProcessorCount=2",
        "SPRING_PROFILES_ACTIVE": "enterprise,ai,distributed",
        "SERVER_ADDRESS": "0.0.0.0",
        "SPRING_DATASOURCE_URL": "jdbc:postgresql://postgres:5432/intelligent_ticket",
        "SPRING_DATASOURCE_USERNAME": "core",
        "DB_PASSWORD": "${CORE_DB_PASSWORD:?required}",
        "JWT_SECRET": "${JWT_SECRET:?required}",
        "SPRING_CONFIG_IMPORT": "optional:classpath:empty.properties",
        "REDIS_CLUSTER_NODES": "redis-0:6379,redis-1:6379,redis-2:6379,redis-3:6379,redis-4:6379,redis-5:6379",
        "SPRING_DATA_REDIS_PASSWORD": "${REDIS_PASSWORD:?required}",
        "RABBITMQ_ADDRESSES": "rabbit-0:5672,rabbit-1:5672,rabbit-2:5672",
        "SPRING_RABBITMQ_USERNAME": "smartticket",
        "SPRING_RABBITMQ_PASSWORD": "${RABBITMQ_PASSWORD:?required}",
        "OLLAMA_URL": "http://host.docker.internal:11434",
        "CORS_ORIGINS": "http://127.0.0.1:8090"
      },
      "extra_hosts": [
        "host.docker.internal:host-gateway"
      ],
      "depends_on": {
        "knowledge": {
          "condition": "service_healthy"
        },
        "redis-init": {
          "condition": "service_completed_successfully"
        },
        "rabbit-0": {
          "condition": "service_healthy"
        },
        "rabbit-1": {
          "condition": "service_healthy"
        },
        "rabbit-2": {
          "condition": "service_healthy"
        }
      },
      "healthcheck": {
        "test": [
          "CMD-SHELL",
          "wget -q --spider http://127.0.0.1:8080/actuator/health/readiness"
        ],
        "interval": "10s",
        "start_period": "90s",
        "retries": 30
      },
      "mem_limit": "768m",
      "stop_grace_period": "40s",
      "restart": "unless-stopped"
    },
    "gateway": {
      "image": "smartticket/gateway:local",
      "build": {
        "context": ".",
        "dockerfile": "docker/distributed/Service.Dockerfile",
        "args": {
          "MODULE": "gateway"
        }
      },
      "environment": {
        "EUREKA_URL": "http://registry:8080/eureka/",
        "INTERNAL_SERVICE_KEY": "${INTERNAL_SERVICE_KEY:?required}",
        "TZ": "Asia/Shanghai",
        "JAVA_TOOL_OPTIONS": "-Duser.timezone=Asia/Shanghai -XX:ActiveProcessorCount=2"
      },
      "depends_on": {
        "backend": {
          "condition": "service_healthy"
        }
      },
      "healthcheck": {
        "test": [
          "CMD-SHELL",
          "wget -q --spider http://127.0.0.1:8080/actuator/health/readiness"
        ],
        "interval": "10s",
        "start_period": "90s",
        "retries": 30
      },
      "mem_limit": "384m",
      "restart": "unless-stopped"
    },
    "frontend": {
      "image": "smartticket/frontend:local",
      "build": {
        "context": ".",
        "dockerfile": "frontend/Dockerfile",
        "target": "prebuilt"
      },
      "volumes": [
        "./docker/distributed/nginx.conf:/etc/nginx/conf.d/default.conf:ro"
      ],
      "ports": [
        "127.0.0.1:8090:80"
      ],
      "depends_on": {
        "gateway": {
          "condition": "service_healthy"
        }
      },
      "mem_limit": "64m",
      "restart": "unless-stopped"
    }
  },
  "volumes": {
    "postgres": {},
    "redis-0": {},
    "redis-1": {},
    "redis-2": {},
    "redis-3": {},
    "redis-4": {},
    "redis-5": {},
    "rabbit-0": {},
    "rabbit-1": {},
    "rabbit-2": {}
  }
}
