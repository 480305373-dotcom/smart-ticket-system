app.ai.enabled=true
spring.ai.model.chat=ollama
spring.ai.model.embedding=ollama
spring.autoconfigure.exclude=
spring.ai.ollama.base-url=${OLLAMA_URL:http://localhost:11434}
spring.ai.ollama.chat.model=${OLLAMA_CHAT_MODEL:qwen3:4b}
spring.ai.ollama.chat.options.temperature=0.2
spring.ai.ollama.chat.options.num-predict=512
spring.ai.ollama.chat.think=false
spring.ai.ollama.embedding.model=${OLLAMA_EMBED_MODEL:nomic-embed-text}
spring.ai.vectorstore.pgvector.dimensions=768
spring.ai.vectorstore.pgvector.table-name=smartticket_article_vectors
spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.retry.max-attempts=1
